stages:
  - prompt_security
  - consolidate
  - sonar_publish

variables:
  REGISTRY: "registry.intranet.local:5000"
  PROMPTS_DIR: "prompts"
  CI_REPO_IMAGE_NAME: "plataformas/prompt-scanner"
  CI_REPO_IMAGE_TAG: "1.1.0"
  DC_IMAGE_BUILD: "pipeline-tools/python:ubuntu-20.04-python3"
  SONAR_SCANNER_IMAGE: "registry.intranet.local:5000/plataformas/sonar-scanner-cli:latest"
  SONAR_QUALITY_GATE_WAIT: "true"
  SONAR_QUALITY_GATE_TIMEOUT: "600"
  EXIT_ON_FINDINGS: "false"
  # Habilitar explícitamente con URL, clave virtual y alias en variables CI.
  RUN_SEMANTIC_SCAN: "false"

.scanner:
  image:
    name: "${REGISTRY}/${CI_REPO_IMAGE_NAME}:${CI_REPO_IMAGE_TAG}"
    entrypoint: [""]
  before_script:
    - cd "$CI_PROJECT_DIR"
    - mkdir -p reports
    - export REPORTS_DIR="$CI_PROJECT_DIR/reports"

prompt_static_scan:
  extends: .scanner
  stage: prompt_security
  script:
    - DEFER_CONSOLIDATION=1 scan-prompts "$PROMPTS_DIR"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/static-scan-manifest.json
      - reports/static-sarif/
      - reports/*-promptsonar.json
      - reports/*-pi-auditor.json

prompt_semantic_scan:
  extends: .scanner
  stage: prompt_security
  rules:
    - if: '$RUN_SEMANTIC_SCAN == "true"'
  script:
    - semantic-scan --defer-exit "$PROMPTS_DIR"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/prompt_audit/

prompt_security_scan:
  extends: .scanner
  stage: consolidate
  needs:
    - job: prompt_static_scan
      artifacts: true
    - job: prompt_semantic_scan
      artifacts: true
      optional: true
  when: always
  script:
    - |
      if [ "$RUN_SEMANTIC_SCAN" = "true" ]; then
        python3 /usr/local/bin/consolidate-scan-reports \
          --static-manifest reports/static-scan-manifest.json \
          --semantic-summary reports/prompt_audit/summary.json \
          --semantic-root "$PROMPTS_DIR"
      else
        python3 /usr/local/bin/consolidate-scan-reports \
          --static-manifest reports/static-scan-manifest.json
      fi
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/

sonar_prompt_security_publish:
  stage: sonar_publish

  image:
    name: "registry.intranet.local:5000/${DC_IMAGE_BUILD}"
    entrypoint: [""]

  # Descarga reports/ generado por el job anterior.
  needs:
    - job: prompt_security_scan
      artifacts: true

  # Publica la evidencia aun si en el futuro el scan bloquea por findings.
  when: always

  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"

  cache:
    key: "sonar-${CI_PROJECT_ID}"
    paths:
      - .sonar/cache

  script:
    - test -s "$CI_PROJECT_DIR/reports/prompt-security-scan.sarif"
    - |
      sonar-scanner \
        -Dsonar.host.url="$SONAR_SERVER" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.projectKey="${CI_PROJECT_NAMESPACE}:${CI_PROJECT_NAME}" \
        -Dsonar.projectVersion="${PROJECT_VERSION:-$CI_COMMIT_SHORT_SHA}" \
        -Dsonar.projectBaseDir="$CI_PROJECT_DIR" \
        -Dsonar.sources="$PROMPTS_DIR" \
        -Dsonar.sarifReportPaths="reports/prompt-security-scan.sarif" \
        -Dsonar.qualitygate.wait="$SONAR_QUALITY_GATE_WAIT" \
        -Dsonar.qualitygate.timeout="$SONAR_QUALITY_GATE_TIMEOUT"